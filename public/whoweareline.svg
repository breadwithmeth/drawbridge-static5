<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Rough dry-brush ink filter effect -->
    <filter id="rough-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="0.4" in="displaced" result="smooth" />
      <feMerge>
        <feMergeNode in="smooth" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#rough-ink)">
    <!-- Vivid Orange Expressive Base Strokes & Accents -->
    <path d="M 180,680 C 300,640 450,600 820,520 C 850,514 830,540 800,545 C 500,610 320,660 160,700 Z" fill="#FF5500" opacity="0.95" />
    <path d="M 340,320 C 360,450 390,620 410,740" stroke="#FF5500" stroke-width="24" stroke-linecap="square" fill="none" />
    <path d="M 680,240 C 660,400 630,580 610,760" stroke="#FF5500" stroke-width="16" stroke-linecap="square" fill="none" />

    <!-- Bold Black Structural Bridge Silhouette -->
    <!-- Main Deck / Span -->
    <path d="M 120,640 L 880,560 L 890,580 L 110,660 Z" fill="#111111" />
    
    <!-- Heavy Cross Braces & Towers (Brutalist Asymmetry) -->
    <path d="M 280,720 L 380,280 L 420,290 L 340,740 Z" fill="#111111" />
    <path d="M 620,760 L 720,200 L 760,210 L 640,780 Z" fill="#111111" />
    <path d="M 360,300 L 740,220 L 745,245 L 365,325 Z" fill="#111111" />

    <!-- Diagonal Tension Strokes (Dry Brush Feel) -->
    <line x1="280" y1="640" x2="360" y2="340" stroke="#111111" stroke-width="28" stroke-linecap="butt" />
    <line x1="420" y1="620" x2="360" y2="440" stroke="#111111" stroke-width="18" stroke-linecap="butt" />
    <line x1="520" y1="600" x2="680" y2="280" stroke="#111111" stroke-width="22" stroke-linecap="butt" />
    <line x1="720" y1="580" x2="680" y2="400" stroke="#111111" stroke-width="14" stroke-linecap="butt" />
    <line x1="200" y1="650" x2="280" y2="500" stroke="#111111" stroke-width="20" stroke-linecap="butt" />
    <line x1="800" y1="570" x2="720" y2="420" stroke="#111111" stroke-width="24" stroke-linecap="butt" />

    <!-- Ground Anchor / Piers (Imperfect Brutalist Blocks) -->
    <path d="M 310,740 L 350,740 C 355,800 305,820 310,840 L 270,840 C 275,800 305,780 310,740 Z" fill="#111111" />
    <path d="M 630,760 L 670,760 C 675,840 625,850 630,880 L 590,880 C 595,830 625,810 630,760 Z" fill="#111111" />

    <!-- Fragmented Ink Splatters / Controlled Chaos Elements -->
    <circle cx="240" cy="480" r="8" fill="#111111" />
    <circle cx="500" cy="350" r="5" fill="#FF5500" />
    <circle cx="530" cy="360" r="3" fill="#111111" />
    <rect x="780" y="320" width="12" height="6" fill="#111111" transform="rotate(-15 780 320)" />
    <rect x="220" y="700" width="16" height="8" fill="#FF5500" transform="rotate(25 220 700)" />
  </g>
</svg>
